<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prologue · 스플래시 질감 비교</title>
  <style>
    @font-face{font-family:Pretendard;src:url('../../../apps/mobile/assets/fonts/Pretendard-Regular.otf')}
    @font-face{font-family:Pretendard;src:url('../../../apps/mobile/assets/fonts/Pretendard-SemiBold.otf');font-weight:600}
    *{box-sizing:border-box}
    body{margin:0;background:#F5F5F5;color:#191919;font-family:Pretendard,sans-serif}
    main{max-width:896px;margin:auto;padding:28px 40px}
    header{margin-bottom:28px}h1{margin:0 0 10px;font-size:27px;font-weight:600;letter-spacing:-.6px}
    header p{margin:0;color:#666;font-size:14px;line-height:1.6}
    .cards{display:grid;grid-template-columns:repeat(2,minmax(0,390px));gap:24px;justify-content:center}
    h2{font-size:16px;font-weight:600;margin:0 0 12px}
    article{min-width:0}
    .card-heading{min-height:48px;display:flex;align-items:center;gap:10px;margin-bottom:8px;background:#F5F5F5}
    .card-heading h2{margin:0;white-space:nowrap}
    .card-heading input[type=range]{flex:1;min-width:48px;accent-color:#525252}
    .percentage{display:flex;align-items:center;gap:3px;font-size:14px}
    .percentage input{width:62px;padding:6px;border:1px solid #bbb;border-radius:6px;font:inherit;background:white;color:inherit}
    .screen{position:relative;width:100%;aspect-ratio:390/844;overflow:hidden;isolation:isolate;background:white;border-radius:14px;box-shadow:0 0 0 1px #E5E5E5}
    .wash,.grain{position:absolute;inset:0;pointer-events:none}
    .wash{background-image:var(--field)}
    .grain{background-image:var(--grain-image);background-size:160px 160px;opacity:.18;mix-blend-mode:soft-light;mask-image:var(--field);mask-mode:alpha;-webkit-mask-image:var(--field)}
    .pencil{position:absolute;inset:0;background:url('wash-pencil-grain.png') repeat;background-size:58% auto;mix-blend-mode:overlay;opacity:.8;pointer-events:none}
    .logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:50.2564103%;height:6.3981043%;object-fit:contain}
    footer{margin-top:24px;color:#777;font-size:12px;line-height:1.7}
    @media(max-width:650px){
      main{padding:24px 18px}h1{font-size:24px}
      .cards{grid-template-columns:minmax(0,390px)}
      #b .card-heading{position:sticky;top:0;z-index:1}
    }
  </style>
</head>
<body data-grain="on">
<main>
  <header>
    <h1>스플래시 질감 비교</h1>
    <p>번짐 범위 100% · 색 농도 125%</p>
  </header>
  <section class="cards" aria-label="시안 비교">
    <article id="a">
      <div class="card-heading"><h2>A · 기존 번짐</h2></div>
      <div class="screen"><div class="wash" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div><img class="logo" alt="Prologue" src="../../../apps/mobile/assets/brand/prologue-wordmark.png"></div>
    </article>
    <article id="b">
      <div class="card-heading">
        <h2><label for="grain-slider">B · 색연필 결</label></h2>
        <input id="grain-slider" type="range" min="0" max="125" step="1" value="100">
        <label class="percentage"><input id="grain-number" type="number" inputmode="numeric" aria-label="B 색연필 결 농도 퍼센트" min="0" max="125" step="1" value="100">%</label>
      </div>
      <div class="screen"><div class="wash" aria-hidden="true"></div><div class="pencil" aria-hidden="true"></div><img class="logo" alt="Prologue" src="../../../apps/mobile/assets/brand/prologue-wordmark.png"></div>
    </article>
  </section>
</main>
<script>
  const fixedDensity=1.25;
  const grainSvg='<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".16 .82" numOctaves="2" seed="8" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>';
  document.documentElement.style.setProperty('--grain-image','url("data:image/svg+xml,'+encodeURIComponent(grainSvg)+'")');
  function field(rx,ry,cx,cy,rgb,peak){
    const alpha=value=>Math.min(.94,peak*value).toFixed(4);
    return 'radial-gradient(ellipse '+rx.toFixed(2)+'% '+ry.toFixed(2)+'% at '+cx+'% '+cy+'%,rgba('+rgb+','+alpha(1)+') 0%,rgba('+rgb+','+alpha(.76)+') 28%,rgba('+rgb+','+alpha(.37)+') 52%,rgba('+rgb+','+alpha(.10)+') 75%,rgba('+rgb+',0) 100%)';
  }
  const range=1.17;
  const strength=fixedDensity;
      const layers=[
        field(90*range,55*range,-8,110,'231,156,133',.47*strength),
        field(73*range,45*range,8,105,'231,156,133',.09*strength),
        field(86*range,53*range,110,-10,'122,181,215',.38*strength),
        field(65*range,45*range,102,0,'122,181,215',.06*strength)
      ];
  document.querySelector('.cards').style.setProperty('--field',layers.join(','));

  const slider = document.getElementById('grain-slider');
  const number = document.getElementById('grain-number');
  const pencil = document.querySelector('#b .pencil');
  function previewGrain() {
    pencil.style.opacity = slider.valueAsNumber / Number(slider.max);
    slider.setAttribute('aria-valuetext', slider.value + '%');
  }
  slider.addEventListener('input', () => {
    number.value = slider.value;
    previewGrain();
  });
  number.addEventListener('input', () => {
    if (Number.isFinite(number.valueAsNumber)) {
      slider.value = number.value;
      previewGrain();
    }
  });
  number.addEventListener('blur', () => { number.value = slider.value; });
  number.addEventListener('keydown', event => {
    if (event.key === 'Enter') number.blur();
  });
  previewGrain();
</script>
</body>
</html>
