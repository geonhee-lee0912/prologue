<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prologue · 스플래시 로고 비교</title>
  <style>
    @font-face{font-family:Pretendard;src:url('../../../apps/mobile/assets/fonts/Pretendard-SemiBold.otf');font-weight:600}
    *{box-sizing:border-box}
    body{margin:0;background:#f5f5f5;color:#191919;font:600 16px Pretendard,sans-serif}
    main{max-width:852px;margin:auto;padding:24px}
    h1{font-size:22px;margin:0 0 22px}
    section{display:grid;grid-template-columns:repeat(2,minmax(0,390px));gap:24px;justify-content:center}
    figure{margin:0}
    figcaption{margin-bottom:10px}
    .screen{display:grid;place-items:center;aspect-ratio:390/844;background:white url('../../../apps/mobile/assets/brand/splash-pencil-wash.webp') center/100% 100% no-repeat;border-radius:14px;overflow:hidden}
    .modern{width:50.25641%;height:auto}
    /* 3번 앱 이미지의 투명 여백을 뺀 글자 폭과 맞춘다 (1040/1088). */
    .friendly{width:48.03922%;height:auto}
    @media(max-width:600px){section{grid-template-columns:minmax(0,390px)}}
  </style>
</head>
<body>
  <main>
    <h1>스플래시 로고 비교 · 색연필 결 30%</h1>
    <section aria-label="로고 두 가지">
      <figure>
        <figcaption>3번 · 모던형 (현재 앱)</figcaption>
        <div class="screen"><img class="modern" src="../../../apps/mobile/assets/brand/prologue-wordmark.png" alt="Prologue"></div>
      </figure>
      <figure>
        <figcaption>2번 · 친근형</figcaption>
        <div class="screen">
          <svg class="friendly" viewBox="112 177 1129 262" role="img" aria-label="Prologue">
            <image href="../../../apps/mobile/assets/brand/wordmark-candidates/02-friendly.svg" width="1344" height="576"/>
          </svg>
        </div>
      </figure>
    </section>
  </main>
</body>
</html>
